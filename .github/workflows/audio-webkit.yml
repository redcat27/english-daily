name: Audio WebKit regression

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/lib/pronunciation.ts'
      - 'src/components/lesson-app.tsx'
      - 'src/lib/data.ts'
      - 'src/app/api/next-preview/route.ts'
      - 'src/app/page.tsx'
      - 'tests/data.test.cjs'
      - 'tests/next-preview.test.cjs'
      - 'src/lib/ai.ts'
      - 'src/lib/lesson.ts'
      - 'tests/browser/**'
      - 'tests/pronunciation.test.cjs'
      - 'playwright.config.ts'
      - '.github/workflows/audio-webkit.yml'

permissions:
  contents: read

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: audio-browser-failure-traces
          path: test-results/
